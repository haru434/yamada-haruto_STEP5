<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEP5 テスト</title>
    <link rel="stylesheet" href="style.css">
    <script src="style.js" defer></script>
</head>
<body>
    <main>
        <button type="button" id="background-button">背景色を変更</button>

        <div class="input-area">
            <input type="text" id="text-input" aria-label="テキスト入力欄">
            <button type="button" id="display-button">表示</button>
            <button type="button" id="add-button">追加</button>
        </div>

        <p id="display-area">表示エリア</p>

        <p>現在の行数: <span id="row-count">0</span> 件</p>

        <table>
            <thead>
                <tr>
                    <th scope="col">内容</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </main>
</body>
</html>
